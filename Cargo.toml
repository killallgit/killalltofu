[package]
name = "killalltofu-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "CLI tool for scheduling automatic destruction of Terraform/OpenTofu infrastructure"
repository = "https://github.com/killallgit/killalltofu"

[[bin]]
name = "killalltofu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
humantime = "2.1"
home = "0.5"

[dev-dependencies]
tempfile = "3"
